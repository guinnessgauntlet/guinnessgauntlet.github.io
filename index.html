<style>
/* Layout: a poured pint. Cream "head" band on top, stout-dark body, sticky tab bar, one column of panels. */
:root{
  color-scheme:dark;
  --bg:#14110f; --panel:#1d1916; --panel2:#27211c; --cream:#f0e6cf; --ink:#14110f;
  --muted:#a89d89; --rule:#3a322b; --amber:#d9a03f; --good:#86c493; --bad:#e58268;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--f-body);font-size:15px;line-height:1.45}
.in{max-width:840px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.head{background:var(--cream);color:var(--ink);padding-top:env(safe-area-inset-top,0px)}
.head .in{padding-block:22px 18px;display:flex;flex-direction:column;gap:4px}
.head h1{font-family:var(--f-display);font-weight:900;font-size:58px;line-height:.88;letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance}
.head .sub{font-size:14px;font-weight:500;display:flex;flex-wrap:wrap;gap:4px 12px}
.head .sync{font-size:13px;opacity:.75}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
nav .in{display:flex;gap:2px;overflow-x:auto}
nav button{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.04em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 12px 7px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--cream);border-bottom-color:var(--amber)}
main.in{padding-block:20px calc(56px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-family:var(--f-display);font-weight:900;font-size:28px;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1}
h3{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin:0}
p{margin:0;max-width:65ch}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.l{text-align:left}
tr.lead td{color:var(--amber)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}
td.total{font-weight:600;font-size:16px}
.detail>td{background:var(--panel2);white-space:normal;text-align:left}
.detail table td{background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 14px var(--f-body);border:1px solid var(--rule);background:var(--panel2);color:var(--cream);border-radius:999px;padding:6px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.chip:disabled{opacity:.4;cursor:default;text-decoration:line-through}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
input,select{font:inherit;color:var(--cream);background:var(--panel2);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;min-width:0}
input.n{width:4.6em;font-family:var(--f-mono);text-align:center}
.grow{flex:1 1 180px}
.btn{font:700 14px var(--f-body);background:var(--amber);color:var(--ink);border:0;border-radius:6px;padding:9px 15px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--rule)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{background:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.notice{border:1px dashed var(--rule);border-radius:10px;padding:14px;color:var(--muted)}
.clock{background:var(--cream);color:var(--ink);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px}
.clock .who{font-family:var(--f-display);font-weight:900;font-size:40px;line-height:.95;text-transform:uppercase}
.clock .meta{font-size:14px;font-weight:500}
.clockrow{display:flex;justify-content:space-between;align-items:center;gap:16px}
.clockrow>div:first-child{display:flex;flex-direction:column;gap:6px;min-width:0}
.timer{display:flex;align-items:center;gap:10px;flex:none}
.pint{width:58px;height:100px;color:var(--ink);overflow:visible}
.pint .glass{fill:rgba(20,17,15,.07)}
.timer.low .pint{color:var(--bad)}
.tleft{font-family:var(--f-mono);font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.timer.low .tleft{color:#b3402b}
.tsub{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;opacity:.7}
.tctl{display:flex;gap:6px;flex-wrap:wrap}
.tctl .btn.ghost{color:var(--ink);border-color:rgba(20,17,15,.3)}
.you{display:inline-block;background:var(--amber);color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:2px 8px;vertical-align:middle}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.team{font:500 14px var(--f-body);text-align:left;background:var(--panel2);color:var(--cream);border:1px solid var(--rule);border-radius:6px;padding:9px 10px;cursor:pointer}
.team:hover:not(:disabled){border-color:var(--amber)}
.team:disabled{opacity:.38;cursor:default}
.team small{display:block;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.team{display:flex;gap:9px;align-items:center}.team>span{min-width:0}
.logo{width:22px;height:22px;object-fit:contain;flex:none;vertical-align:middle}
.logo.sm{width:18px;height:18px;margin-right:6px}
.logo.lg{width:30px;height:30px;margin-right:8px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--amber);border-radius:8px;padding:12px}
.list{display:flex;flex-direction:column}
.list>div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.list>div:last-child{border-bottom:0}
.add{display:flex;gap:8px;flex-wrap:wrap}.add input{flex:1 1 160px}
.card{border-top:1px solid var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.card:first-child{border-top:0;padding-top:0}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.pts{font-family:var(--f-mono);font-size:18px}
.quad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.quad input,.quad select{width:100%;text-align:center;font-family:var(--f-mono);padding:6px 2px}
.rules dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 16px;margin:0}
.rules dt{font-weight:600}.rules dd{margin:0;color:var(--muted)}
.ev{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--rule)}
.ev:last-child{border-bottom:0}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:1px 7px}
.tag.done{color:var(--amber)} .tag.live{color:var(--good)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--cream);color:var(--ink);font-weight:600;padding:9px 14px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
[hidden]{display:none!important}
@media (max-width:520px){.head h1{font-size:44px}.clock .who{font-size:32px}nav button{font-size:18px;padding:10px 9px 7px}.rules dl{grid-template-columns:1fr}.rules dd{margin-bottom:6px}}
@media (prefers-reduced-motion:no-preference){.chip,.team,nav button{transition:background .15s,border-color .15s,color .15s}}
</style>
</head>
<body>
<header class="head"><div class="in">
  <h1>Guinness Gauntlet</h1>
  <div class="sub"><span id="seasonLabel">League year 2026–27</span><span>Every sport scaled to MLB’s 162 games</span></div>

<script type="module">
/* ================= Firebase adapter ================= */
const FB='https://www.gstatic.com/firebasejs/10.12.2/';
let db=null,me=null,email='',isCommish=false,AUTH=null;
async function connect(){
  const cfg=window.GG_FIREBASE;
  if(!cfg||!cfg.apiKey||cfg.apiKey.startsWith('PASTE'))throw Object.assign(new Error('config'),{code:'no-config'});
  const [{initializeApp},F,A]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-firestore.js'),import(FB+'firebase-auth.js')]);
  const app=initializeApp(cfg),fs=F.getFirestore(app),auth=A.getAuth(app);
  await new Promise((res,rej)=>{let first=true;A.onAuthStateChanged(auth,u=>{
    if(!u){A.signInAnonymously(auth).catch(rej);return}
    me=u.uid;email=(u.email||'').toLowerCase();
    const done=c=>{isCommish=c;if(first){first=false;res()}else render()};
    if(!email)return done(false);
    crypto.subtle.digest('SHA-256',new TextEncoder().encode(email)).then(h=>{
      const hex=[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');
      done(hex===String(window.GG_COMMISSIONER_HASH||'').trim().toLowerCase())}).catch(()=>done(false))})});
  AUTH={signIn:()=>A.signInWithPopup(auth,new A.GoogleAuthProvider()),signOut:()=>A.signOut(auth)};
  const wrapSnapDoc=s=>({id:s.id,exists:s.exists(),data:()=>s.data(),metadata:s.metadata});
  const wrapD=r=>({id:r.id,get:async()=>wrapSnapDoc(await F.getDoc(r)),set:d=>F.setDoc(r,d),delete:()=>F.deleteDoc(r),
    onSnapshot:(n,e)=>F.onSnapshot(r,s=>n(wrapSnapDoc(s)),e)});
  const wrapQ=q=>({onSnapshot:(n,e)=>F.onSnapshot(q,s=>n({docs:s.docs.map(wrapSnapDoc),metadata:s.metadata}),e)});
  return {
    doc:p=>wrapD(F.doc(fs,p)),
    collection:p=>{const ref=F.collection(fs,p);return {orderBy:f=>wrapQ(F.query(ref,F.orderBy(f))),onSnapshot:(n,e)=>wrapQ(ref).onSnapshot(n,e),doc:id=>wrapD(id?F.doc(ref,id):F.doc(ref))}}
  };
}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f1=n=>(Math.round(n*10)/10).toFixed(1);
const slug=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ø/g,'o').replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
const rid=(sport,team)=>sport+'__'+slug(team);
const mname=id=>S.members.find(m=>m.id===id)?.name||'Someone';
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800)}
const B=k=>{const v=Number(S.cfg.bonus?.[k]);const n=Number.isFinite(v)?v:DEF_BONUS[k];return k==='spoon'?Math.abs(n):n};
const isDone=id=>S.cfg.done?.[id]??!!S.meta[id]?.done;

/* ================= Definitions ================= */
const eventList=()=>[...EVENTS,...(S.cfg.customEvents||[]).map(c=>({...c,short:c.name.slice(0,10),when:'Custom event',ladder:GENERIC}))];
const activeEvents=()=>eventList().filter(e=>S.cfg.events?.[e.id]?.active);
const defOf=id=>id==='flex'?FLEX:SPORTS.find(s=>s.id===id)||{...eventList().find(e=>e.id===id),kind:'event'};
const evWeight=id=>{const w=Number(S.cfg.events?.[id]?.weight);return w>0?w:1};
const FLEX={id:'flex',name:'Flex',short:'Flex',kind:'flex'};
const activeSports=()=>SPORTS.filter(x=>S.cfg.sportsOn?.[x.id]);
const flexSports=()=>activeSports().filter(x=>x.kind!=='avp');
const maxPeople=()=>Math.min(99,...activeSports().filter(x=>x.teams).map(x=>x.teams.length));
function columns(){const ids=new Set(S.picks.map(p=>p.sport));return [...SPORTS.filter(x=>S.cfg.sportsOn?.[x.id]||S.picks.some(p=>p.sport===x.id&&!p.flex)),...((D().slots||{}).flex||S.picks.some(p=>p.flex)?[FLEX]:[]),...eventList().filter(e=>S.cfg.events?.[e.id]?.active||ids.has(e.id)).map(e=>({...e,kind:'event'}))]}
function teamList(sp){ // prefer names written by the score updater so picks match its records
  const fromFeed=Object.values(S.results).filter(r=>r.sport===sp.id&&r.feed).map(r=>r.team);
  return (fromFeed.length>=sp.teams.length*0.8?fromFeed:sp.teams).slice().sort((a,b)=>a.localeCompare(b));
}

const poolOf=def=>def.kind==='golf'?GOLFERS:def.kind==='tennis'?TENNIS:def.pool||COUNTRIES;
const pickPrompt=def=>def.kind==='golf'?'Type a golfer':def.kind==='tennis'?'Type a tennis player':def.pickLabel||'Type a country or team';

/* ================= Scoring ================= */
// Postseason ladder: 0 missed · 1 made it · 2 won a round · 3 won two · 4 lost final · 5 champion
const ladder=st=>st<=0?0:B('makeIt')+B('perRound')*(st-1)+(st>=5?B('champ'):0);
const posStage=(id,pos)=>{if(!pos)return 0;
  return pos===1?5:pos===2?4:pos<=4?3:pos<=6?2:pos<=10?1:0};
function pctOf(sp,r){if(!r)return null;const w=+r.w||0,l=+r.l||0,x=+r.x||0,gp=w+l+x;return gp?(w+(sp.xw||0)*x)/gp:null}
function teamScore(sp,team){
  const r=S.results[rid(sp.id,team)];
  if(sp.kind==='event'){const st=r?.stage|0,post=ladder(st)*evWeight(sp.id);return {season:0,post,best:0,pts:post,stage:st,r}}
  let season=0,stage=r?.stage|0,pct=null,best=0,spoon=0;
  if(sp.kind==='f1'){const N=Number(S.meta.f1?.teams)||22,pos=+r?.pos||0,f=S.meta.f1;
    const frac=isDone('f1')?1:f?.total?Math.min(1,(+f.round||0)/f.total):1;
    if(pos)season=(N-pos)/(N-1)*BASE*frac;
    if(isDone('f1')){stage=posStage('f1',pos);if(pos===1)best=B('best');if(pos&&pos===N)spoon=B('spoon')}else stage=0}
  else{pct=pctOf(sp,r);const w=+r?.w||0,x=+r?.x||0;season=(w+(sp.xw||0)*x)*BASE/(SEASON_GAMES[sp.id]||82);
    if(sp.kind==='table'){if(isDone(sp.id)){const pos=+r?.pos||0;stage=posStage(sp.id,pos);if(pos===1)best=B('best');if(pos>=18)spoon=B('spoon')}else stage=0}
    else if(isDone(sp.id)){const has=k=>(S.meta[sp.id]?.[k]||[]).map(slug).includes(slug(team));if(has('best'))best=B('best');if(has('worst'))spoon=B('spoon')}}
  const post=ladder(stage);return {season,post,best,spoon,pts:season+post+best-spoon,pct,stage,r};
}
function scoreOf(mid,sp){
  if(sp.kind==='flex'){const items=S.picks.filter(p=>p.member===mid&&p.flex).map(p=>{const d=defOf(p.sport);
      const sc=d.kind==='golf'||d.kind==='tennis'?groupScore(d,[p]):teamScore(d,p.team);return {team:p.team,sport:p.sport,...sc}});
    return {season:items.reduce((a,i)=>a+i.season,0),post:items.reduce((a,i)=>a+i.post+(i.best||0)-(i.spoon||0),0),pts:items.reduce((a,i)=>a+i.pts,0),items}}
  return groupScore(sp,S.picks.filter(p=>p.member===mid&&p.sport===sp.id&&!p.flex));
}
function groupScore(sp,mine){
  if(sp.kind==='golf'){let season=0,wins=0;const items=mine.map(p=>{const pos=S.results[rid('golf',p.team)]?.pos||[];
      pos.forEach(v=>{season+=golfPts(v);if(String(v||'').trim()==='1')wins++});return {team:p.team,pos}});
    return {season,post:0,pts:season,items,note:`${wins} major${wins===1?'':'s'} won`}}
  if(sp.kind==='tennis'){let W=0,L=0,titles=0,finals=0;const items=mine.map(p=>{const res=S.results[rid('tennis',p.team)]?.res||[];
      res.forEach(c=>{const wl=SLAM_WL[c];if(wl){W+=wl[0];L+=wl[1]}if(c==='W')titles++;if(c==='F')finals++});return {team:p.team,res}});
    const season=W*TENNIS_WIN,post=titles*B('slamWin')+finals*B('slamFinal');
    return {season,post,pts:season+post,items,note:`${W}–${L} in Slam matches`}}
  if(sp.kind==='avp'){let season=0;const evs=S.cfg.avpEvents||[];const items=mine.map(p=>{const res=S.results[rid(sp.id,p.team)]?.res||{};
      const codes=evs.map(e=>res[e.id]||'');codes.forEach(c=>{season+=(AVP_FIN.find(f=>f[0]===c)?.[2])||0});return {team:p.team,codes}});
    return {season,post:0,pts:season,items,note:`${evs.length} tournament${evs.length===1?'':'s'} counted`}}
  const items=mine.map(p=>({team:p.team,...teamScore(sp,p.team)}));
  const pts=items.reduce((a,i)=>a+i.pts,0);
  return {season:items.reduce((a,i)=>a+i.season,0),post:items.reduce((a,i)=>a+i.post+i.best-(i.spoon||0),0),pts,items};
}
function standings(){const cols=columns();
  return S.members.map(m=>{const by={};let total=0,titles=0;for(const c of cols){by[c.id]=scoreOf(m.id,c);total+=by[c.id].pts;titles+=(by[c.id].items||[]).filter(i=>i.stage===5).length}
    return {m,by,total,titles}}).sort((a,b)=>b.total-a.total||b.titles-a.titles)}
function logoOf(sport,team){const m=S.meta.logos?.[sport];if(!m)return null;
  if(m[team])return m[team];const p=slug(team),keys=Object.keys(m);
  const k=keys.find(k=>slug(k)===p)||keys.find(k=>slug(k).endsWith('-'+p)||p.endsWith('-'+slug(k)));return k?m[k]:null}
const logoImg=(sport,team,cls='')=>{const u=logoOf(sport,team);return u?`<img class="logo ${cls}" src="${esc(u)}" alt="" loading="lazy" onerror="this.remove()">`:''};
/* Draft projections: blend this season's pace with last season (early-season records are noisy). */
function prevPct(sport,team){const m=S.meta.prev?.[sport];if(!m)return null;if(m[team]!=null)return m[team];
  const p=slug(team),k=Object.keys(m).find(k=>slug(k)===p||slug(k).endsWith('-'+p)||p.endsWith('-'+slug(k)));return k?m[k]:null}
function projPts(sp,team){
  if(!['team','table','f1'].includes(sp.kind))return null;
  const r=S.results[rid(sp.id,team)],prev=prevPct(sp.id,team);
  if(sp.kind==='f1'){const N=Number(S.meta.f1?.teams)||22,pos=+r?.pos||0;const cur=pos?(N-pos)/(N-1):null;
    const base=prev??.35;return (cur==null?base:(cur+base)/2)*BASE}
  const base=prev??(sp.id==='epl'?.4:.5),cur=pctOf(sp,r),gp=r?(+r.w||0)+(+r.l||0)+(+r.x||0):0,k=SEASON_GAMES[sp.id]*.25;
  return (cur==null?base:(gp*cur+k*base)/(gp+k))*BASE}
function projRanks(sp){const list=teamList(sp).map(t=>[t,projPts(sp,t)??0]).sort((a,b)=>b[1]-a[1]);const m={};list.forEach(([t],i)=>m[slug(t)]=i+1);return m}
let draftSort='proj',flexSport='nfl';
const showProj=()=>S.cfg.showProj!==false;
const chooserSport=()=>pickSport==='flex'?flexSport:pickSport;
try{draftSort=localStorage.getItem('gg-sort')||'proj'}catch(_){}

function record(sp,r){if(!r)return '—';
  if(sp.kind==='f1')return r.pos?`P${r.pos} · ${r.pts??0} pts`:'—';
  const w=+r.w||0,l=+r.l||0,x=+r.x||0;if(!w&&!l&&!x)return '0–0';
  if(sp.kind==='table')return `${w}–${x}–${l}${r.pos?` · ${ordinal(r.pos)}`:''}`;return x?`${w}–${l}–${x}`:`${w}–${l}`}
function ordinal(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}

/* ================= Draft engine ================= */
const D=()=>S.draft||{status:'setup',order:[]};
function draftOrder(){const o=(D().order||[]).filter(id=>S.members.some(m=>m.id===id));S.members.forEach(m=>{if(!o.includes(m.id))o.push(m.id)});return o}
const slotsTotal=sl=>Object.values(sl||{}).reduce((a,b)=>a+b,0);
function draftPicks(){const b=D().base||0;return S.picks.filter(p=>p.n>=b).sort((a,b)=>a.n-b.n)}
function onClock(i){const o=D().order||[],N=o.length;if(!N)return null;const r=Math.floor(i/N),k=i%N;return o[r%2===0?k:N-1-k]}
function need(mid){const sl=D().slots||{},b=D().base||0,out={},mine=S.picks.filter(p=>p.member===mid&&p.n>=b);
  for(const id in sl)out[id]=sl[id]-(id==='flex'?mine.filter(p=>p.flex).length:mine.filter(p=>p.sport===id&&!p.flex).length);return out}
function takenMap(sport){const m={};S.picks.filter(p=>p.sport===sport).forEach(p=>m[slug(p.team)]=p.member);return m}
function mainSlots(){const sl={};activeSports().forEach(s=>sl[s.id]=s.count||1);sl.flex=1;activeEvents().forEach(e=>{if(!S.picks.some(p=>p.sport===e.id))sl[e.id]=1});return sl}
const nextN=()=>S.picks.reduce((a,p)=>Math.max(a,p.n+1),0);
const pid=n=>'p'+String(n).padStart(4,'0');

/* ================= Views ================= */
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
  $('#seasonLabel').textContent='League year '+(S.cfg.season||'2026–27');
  const sl=$('#syncLine');
  if(S.sync?.at){const t=new Date(S.sync.at);sl.textContent='Scores updated '+(isNaN(t)?S.sync.at:t.toLocaleString([], {weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}))+(S.sync.note?' · '+S.sync.note:'')}
  else if(ready)sl.textContent='Waiting for the first automatic score update';
  if(!ready)return;
  $('#view').innerHTML=({standings:viewStandings,draft:viewDraft,scores:viewScores,league:viewLeague}[tab])();
  tick();
}
function viewStandings(){
  if(!S.members.length)return `<div class="notice">No one is in the Gauntlet yet. Add everyone on the League tab, then run the draft.</div>`;
  if(!S.picks.length)return `<section class="panel"><h2>Standings</h2><p class="muted">Standings appear once the draft starts. Signed up: ${S.members.map(m=>esc(m.name)).join(', ')}.</p><div><button class="btn" data-go="draft">Go to the draft</button></div></section>`;
  const cols=columns(),rows=standings();let prev=null,rank=0;
  const body=rows.map((r,i)=>{if(r.total!==prev){rank=i+1;prev=r.total}
    const isOpen=openRow===r.m.id;
    return `<tr class="click ${rank===1?'lead':''}" data-open="${r.m.id}" aria-expanded="${isOpen}"><td class="num l">${rank}</td><td class="l">${esc(r.m.name)}${r.m.uid&&r.m.uid===me?' <span class="you">You</span>':''}</td>${cols.map(c=>`<td class="num">${f1(r.by[c.id].pts)}</td>`).join('')}<td class="num total">${f1(r.total)}</td></tr>`
      +(isOpen?`<tr class="detail"><td colspan="${cols.length+3}">${breakdown(r,cols)}</td></tr>`:'')}).join('');
  const lead=rows[0],pints=S.members.length-1;
  const leaders=cols.map(c=>{const best=rows.map(r=>({r,v:r.by[c.id].pts})).sort((a,b)=>b.v-a.v)[0];return best&&best.v>0?`<div><span>${esc(c.short)}</span><span>${esc(best.r.m.name)} <span class="num muted">${f1(best.v)}</span></span></div>`:''}).join('');
  return `<div class="clock"><span class="label" style="color:inherit;opacity:.7">The stakes</span><div class="who" style="font-size:30px">🍺 ${esc(lead.m.name)} is owed ${pints} pint${pints===1?'':'s'}</div><div class="meta">Losers each buy the winner a Guinness when the season ends.</div></div>
  <section class="panel"><div class="cardhead"><h2>Standings</h2><span class="small muted">Tap a name for their teams</span></div>
   <div class="scroll"><table><tr><th class="l">#</th><th class="l">Name</th>${cols.map(c=>`<th title="${esc(c.name)}">${esc(c.short)}</th>`).join('')}<th>Total</th></tr>${body}</table></div>
   <p class="small muted">Everyone starts at 0. Each win is worth 162 ÷ the league’s season length (an NFL win is 9.5, an MLB win is 1), so a perfect season is worth the same in every sport. Playoff, title and best-record bonuses add on; the wooden spoon takes 10 away.</p></section>
  ${leaders?`<section class="panel"><h3>Leading each sport</h3><div class="list">${leaders}</div></section>`:''}`;
}
function breakdown(r,cols){
  const rows=cols.flatMap(c=>{const s=r.by[c.id];
    if(c.kind==='flex')return s.items.map(it=>{const d=defOf(it.sport);
      return `<tr><td class="l">Flex · ${esc(d.short)}</td><td class="l">${logoImg(it.sport,it.team,'sm')}${esc(it.team)}</td><td class="l num">${d.kind==='golf'||d.kind==='tennis'?esc(it.note||''):record(d,it.r)}</td><td class="num">${f1(it.season)} + ${f1(it.post+(it.best||0))}</td><td class="num">${f1(it.pts)}</td></tr>`});
    if(c.kind==='golf'||c.kind==='tennis'||c.kind==='avp'){if(!s.items.length)return [];
      return s.items.map(it=>`<tr><td class="l">${c.short}</td><td class="l">${esc(it.team)}</td><td class="l num">${(c.kind==='golf'?it.pos:c.kind==='avp'?it.codes.map(v=>AVP_FIN.find(f=>f[0]===v)?.[1]):it.res).map(v=>esc(v||'–')).join(' · ')||'–'}</td><td></td><td></td></tr>`)
        .concat(`<tr><td class="l">${c.short}</td><td class="l muted">${s.note}</td><td></td><td class="num">${f1(s.season)} + ${f1(s.post)}</td><td class="num">${f1(s.pts)}</td></tr>`)}
    return s.items.map(it=>{const lab=c.ladder[it.stage]||'';
      return `<tr><td class="l">${esc(c.short)}</td><td class="l">${logoImg(c.id,it.team,'sm')}${esc(it.team)}</td><td class="l num">${c.kind==='event'?esc(lab):record(c,it.r)+(it.stage?` · ${esc(lab)}`:'')}${it.best?' · best record':''}${it.spoon?' · wooden spoon':''}</td><td class="num">${c.kind==='event'?'':f1(it.season)+' + '}${f1(it.post+it.best-(it.spoon||0))}</td><td class="num">${f1(it.pts)}</td></tr>`})});
  return `<div class="scroll"><table><tr><th class="l">Sport</th><th class="l">Pick</th><th class="l">Record</th><th>Season + bonus</th><th>Pts</th></tr>${rows.join('')||'<tr><td class="l muted" colspan="5">No picks yet</td></tr>'}</table></div>`;
}
function viewDraft(){
  const d=D(),ro=isCommish?'':' disabled';
  if(d.status!=='live'&&!S.picks.length){
    const order=draftOrder(),sl=mainSlots(),per=slotsTotal(sl),tooMany=S.members.length>maxPeople();
    return `<section class="panel"><h2>Draft setup</h2>
     <p class="muted">Snake draft. On your turn, take any team or player from any sport you still need. Everyone ends with ${activeSports().map(x=>(x.count>1?x.count+' ':'one ')+x.short+(x.kind==='golf'?' golfers':x.kind==='tennis'?' players':x.kind==='avp'?' pair':x.kind==='f1'?' driver':' team')).join(', ')} and one flex pick from any of those sports${activeEvents().length?', plus one pick per special event':''}: ${per} picks each.</p>
     ${S.members.length<2?`<div class="notice">Add at least two people on the League tab first${isCommish?', or add test drafters to try it out':''}.</div><div class="row"><button class="btn ghost" data-go="league">Go to League</button>${isCommish?'<button class="btn ghost" data-act="addTesters">Add 4 test drafters</button>':''}</div>`:`
     <div class="label">Draft order</div>
     <div class="list">${order.map((id,i)=>`<div><span><span class="num muted">${i+1}.</span> ${esc(mname(id))}</span><span class="row"><button class="btn ghost small" data-move="${i}:-1" aria-label="Move up"${i===0||!isCommish?' disabled':''}>↑</button><button class="btn ghost small" data-move="${i}:1" aria-label="Move down"${i===order.length-1||!isCommish?' disabled':''}>↓</button></span></div>`).join('')}</div>
     ${isCommish?projSwitch():''}
     <label class="field" style="max-width:220px"><span class="label">Pick timer</span><select id="pickSeconds" data-pickseconds${ro}>${[[0,'No timer'],[30,'30 seconds'],[60,'1 minute'],[80,'1 minute 20'],[119.5,'Perfect pour (119.5 sec)'],[180,'3 minutes']].map(([v,l])=>`<option value="${v}"${(d.pickSeconds??119.5)===v?' selected':''}>${l}</option>`).join('')}</select></label>
     <div class="row"><button class="btn ghost" data-act="shuffle"${ro}>Shuffle order</button>${isCommish?'<button class="btn ghost" data-act="addTesters">Add 4 test drafters</button>':''}<button class="btn" data-act="start"${tooMany||!isCommish?' disabled':''}>Start the draft</button></div>
     ${isCommish?'':'<p class="small muted">The commissioner sets the order and starts the draft.</p>'}
     ${tooMany?`<p class="small" style="color:var(--bad)">The smallest league this season has ${maxPeople()} teams, so the Gauntlet tops out at ${maxPeople()} people.</p>`:''}
     ${confirmKey==='start'?`<div class="confirm"><span>Start the draft with this order?</span><button class="btn" data-yes="start">Start</button><button class="btn ghost" data-no>Not yet</button></div>`:''}`}
    </section>`;
  }
  const picks=draftPicks(),total=(d.order||[]).length*slotsTotal(d.slots),i=picks.length;
  let top='';
  if(d.status==='live'&&i<total){
    const mid=onClock(i),N=d.order.length,nd=need(mid),openSports=Object.keys(nd).filter(k=>nd[k]>0);
    if(!pickSport||!openSports.includes(pickSport))pickSport=openSports[0];
    if(pickSport==='flex'&&!flexSports().some(x=>x.id===flexSport))flexSport=flexSports()[0]?.id||'nfl';
    const def=defOf(chooserSport()),tk=takenMap(def.id),mine=S.members.find(m=>m.id===mid);
    let chooser;
    if(def.teams){const ranks=projRanks(def),list=teamList(def);
      if(draftSort==='proj'&&showProj())list.sort((a,b)=>(!!tk[slug(a)]-!!tk[slug(b)])||((projPts(def,b)??0)-(projPts(def,a)??0)));
      chooser=showProj()?`<div class="row" style="justify-content:space-between;align-items:center"><span class="small muted">Proj = estimated season points (this season’s pace blended with last season). #1 = best in the league.</span>
        <label class="field"><span class="label">Sort</span><select id="draftSort" data-draftsort><option value="proj"${draftSort==='proj'?' selected':''}>Best projected</option><option value="az"${draftSort==='az'?' selected':''}>A–Z</option></select></label></div>`:'';
      chooser+=`
       <div class="grid">${list.map(t=>{const own=tk[slug(t)],r=S.results[rid(def.id,t)],pp=projPts(def,t);
      return `<button class="team" data-pick="${esc(t)}"${own||!canWrite?' disabled':''}>${logoImg(def.id,t)}<span>${esc(t)}<small>${own?esc(mname(own)):[r?record(def,r):'',pp!=null&&showProj()?`Proj ${Math.round(pp)} · #${ranks[slug(t)]}`:''].filter(Boolean).join(' · ')}</small></span></button>`}).join('')}</div>`}
    else{const pool=poolOf(def),sugg=pool.filter(x=>!tk[slug(x)]);
      chooser=`<form class="add" id="freePick"><input id="freeInput" list="freeList" placeholder="${pickPrompt(def)}" aria-label="Pick" maxlength="60" autocomplete="off"${canWrite?'':' disabled'}><datalist id="freeList">${sugg.map(x=>`<option value="${esc(x)}">`).join('')}</datalist><button class="btn"${canWrite?'':' disabled'}>Draft</button></form>
       ${Object.keys(tk).length?`<p class="small muted">Taken: ${S.picks.filter(p=>p.sport===def.id).map(p=>esc(p.team)+' ('+esc(mname(p.member))+')').join(', ')}</p>`:''}`}
    const nextUp=[1,2].map(k=>i+k<total?esc(mname(onClock(i+k))):null).filter(Boolean);
    top=`<div class="clock"><div class="clockrow"><div><span class="label" style="color:inherit;opacity:.7">On the clock · Pick ${i+1} of ${total} · Round ${Math.floor(i/N)+1}</span>

/* Pick timer: a pint that drains as the clock runs. */
const GLASS='M9 6 L71 6 L74 42 L63 134 L17 134 L6 42 Z';
const PINT=`<svg class="pint" viewBox="0 0 80 140" aria-hidden="true"><defs><clipPath id="pintClip"><path d="${GLASS}"/></clipPath></defs>
  <path class="glass" d="${GLASS}"/>
  <g clip-path="url(#pintClip)"><rect id="beer" x="0" y="16" width="80" height="130" fill="#1b100b"/><rect id="foam" x="0" y="6" width="80" height="11" fill="#fbf4e2"/></g>
  <path d="${GLASS}" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg>`;
function clockElapsed(d){if(d.paused)return Number(d.pausedElapsed)||0;const t=Date.parse(d.clockStart||d.startedAt||'');return isNaN(t)?0:Math.max(0,(Date.now()-t)/1000)}
function tick(){
  const el=document.getElementById('timer'),d=D();if(!el||d.status!=='live'||!d.pickSeconds)return;
  const total=d.pickSeconds,left=Math.max(0,total-clockElapsed(d)),frac=left/total;
  const top=16+(1-frac)*(134-16);
  const beer=document.getElementById('beer'),foam=document.getElementById('foam');
  beer.setAttribute('y',top.toFixed(1));foam.setAttribute('y',(top-10).toFixed(1));foam.setAttribute('height',left>0?'11':'0');
  document.getElementById('tLeft').textContent=(Math.floor(left*10)/10).toFixed(1);
  document.getElementById('tSub').textContent=d.paused?'Paused':left>0?'seconds':'Time’s up';
  el.classList.toggle('low',left<=Math.min(10,total*.2));
}
setInterval(()=>{tick();checkMyTurn()},100);

/* Draft alerts: chime, vibration, tab title and a notification when it's your pick (site must be open). */
const TITLE=document.title;
let audioCtx=null,lastAlert='',lastCall='',wakeLock=null;
function unlockAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(_){}}
document.addEventListener('pointerdown',unlockAudio);
function chime(n){if(!audioCtx)return;const t0=audioCtx.currentTime;
  [659,880,1047].slice(0,n).forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=t0+i*.2;
    o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.6);
    o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+.65)})}
function alertMe(kind){
  chime(kind==='up'?3:2);
  try{navigator.vibrate?.(kind==='up'?[250,120,250,120,250]:[150,80,150])}catch(_){}
  if(document.hidden&&'Notification' in window&&Notification.permission==='granted'){
    try{new Notification(kind==='up'?'🍺 You’re on the clock':'⏳ 20 seconds left to pick',{body:'Guinness Gauntlet draft',icon:'icons/icon-192.png',tag:'gg-draft'})}catch(_){}}
}
function myTurn(){const d=D();if(!ready||d.status!=='live')return null;const i=draftPicks().length;if(i>=(d.order||[]).length*slotsTotal(d.slots))return null;
  const m=S.members.find(x=>x.id===onClock(i));return m?.uid&&m.uid===me?{d,key:(d.base||0)+':'+i}:null}
function checkMyTurn(){
  const t=myTurn();document.title=t?'🍺 You’re up! · '+TITLE:TITLE;if(!t)return;
  if(lastAlert!==t.key){lastAlert=t.key;alertMe('up')}
  if(t.d.pickSeconds&&!t.d.paused){const left=t.d.pickSeconds-clockElapsed(t.d);if(left<=20&&left>0&&lastCall!==t.key){lastCall=t.key;alertMe('last')}}
}
async function keepAwake(){try{if('wakeLock' in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener?.('release',()=>{wakeLock=null})}}catch(_){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&D().status==='live'&&alertsOn())keepAwake()});
const alertsOn=()=>{try{return localStorage.getItem('gg-alerts')==='on'}catch(_){return false}};
async function enableAlerts(){unlockAudio();chime(3);try{navigator.vibrate?.([200])}catch(_){}
  try{if('Notification' in window&&Notification.permission==='default')await Notification.requestPermission()}catch(_){}
  try{localStorage.setItem('gg-alerts','on')}catch(_){}keepAwake();render();toast('Draft alerts on. Keep this page open during the draft.')}

function commishPanel(){
  return `<section class="panel"><h3>Commissioner</h3>${isCommish
    ?`<p class="small muted">Signed in as ${esc(email)}. You can run the draft, change settings and correct scores.</p><div><button class="btn ghost small" data-act="commishOut">Sign out</button></div>`
    :email?`<p class="small muted">${esc(email)} isn’t the commissioner account.</p><div><button class="btn ghost small" data-act="commishOut">Sign out</button></div>`
    :`<p class="small muted">Scores and settings are locked. Only the commissioner can change them.</p><div><button class="btn ghost small" data-act="commishIn">Commissioner sign in</button></div>`}</section>`;
}

/* ================= Writes ================= */
const fail=e=>{console.error(e);toast(e?.code==='permission-denied'?'The database refused that change. Check the Firestore rules.':'Couldn’t save. Check your connection and try again.')};
function queue(key,path,getData){dirty[key]=true;clearTimeout(timers[key]);timers[key]=setTimeout(()=>flush(key,path,getData),600)}
async function flush(key,path,getData){if(!db)return;
  if(inflight[key]){again[key]=[path,getData];return}inflight[key]=true;
  try{await db.doc(path).set(getData())}catch(e){fail(e)}inflight[key]=false;
  if(again[key]){const a=again[key];again[key]=null;flush(key,...a)}else dirty[key]=false}
const saveCfg=()=>queue('cfg','config/main',()=>structuredClone(S.cfg));
async function setDraft(d){S.draft=d;render();try{await db.doc('draft/main').set(d)}catch(e){fail(e)}}
async function makePick(){
  const d=D(),i=draftPicks().length,mid=onClock(i),p=pending;pending=null;if(!p||!mid)return;
  if(takenMap(p.sport)[slug(p.team)]){render();return toast(p.team+' is already taken.')}
  const slotKey=p.flex?'flex':p.sport;
  if((need(mid)[slotKey]||0)<1){render();return toast(mname(mid)+' already has their '+defOf(slotKey).short+' pick.')}
  const n=nextN(),ref=db.doc('picks/'+pid(n));
  try{const ex=await ref.get();if(ex.exists){toast('Someone just made that pick. The board has refreshed.');render();return}
    const doc={n,member:mid,sport:p.sport,team:p.team,at:new Date().toISOString(),...(p.flex?{flex:true}:{})};
    S.picks.push(doc);render();await ref.set(doc);
    const finished=i+1>=d.order.length*slotsTotal(d.slots);
    await setDraft({...D(),status:finished?'done':'live',clockStart:doc.at,paused:false,pausedElapsed:0});
  }catch(e){fail(e)}
}

function projSwitch(){return `<label class="row small" style="align-items:center;gap:8px"><input type="checkbox" id="showProj" data-showproj${showProj()?' checked':''}> Show projected points and “best available” in the draft</label>`}
function bestAvailable(openSports){
  if(!showProj())return '';
  const ids=openSports.includes('flex')?[...new Set([...openSports.filter(x=>x!=='flex'),...flexSports().map(x=>x.id)])]:openSports;
  const rows=[];for(const id of ids){const def=defOf(id);if(!def.teams)continue;const tk=takenMap(id);
    for(const t of teamList(def))if(!tk[slug(t)]){const pp=projPts(def,t);if(pp!=null)rows.push({id,t,pp,short:def.short})}}
  if(!rows.length)return '';rows.sort((a,b)=>b.pp-a.pp);
  return `<section class="panel"><div class="label">Best available for the sports they still need</div><div class="list">${rows.slice(0,5).map(x=>
    `<div><span>${logoImg(x.id,x.t,'sm')}${esc(x.t)} <span class="muted small">${esc(x.short)}</span></span><span class="num">Proj ${Math.round(x.pp)}</span></div>`).join('')}</div>
    <p class="small muted">Golf and tennis don’t have projections; pick on gut and form.</p></section>`;
}
let autoRunning=false;
async function autoPick(){
  const d=D(),i=draftPicks().length;if(d.status!=='live'||i>=d.order.length*slotsTotal(d.slots))return false;
  const mid=onClock(i),nd=need(mid),open=Object.keys(nd).filter(k=>nd[k]>0);if(!open.length)return false;
  const slot=open[Math.floor(Math.random()*open.length)],sport=slot==='flex'?flexSports()[Math.floor(Math.random()*flexSports().length)].id:slot,def=defOf(sport),tk=takenMap(sport);
  let options=(def.teams?teamList(def):poolOf(def)).filter(t=>!tk[slug(t)]);
  if(!options.length){let k=1;while(tk[slug('Test pick '+k)])k++;options=['Test pick '+k]}
  pending={sport,team:options[Math.floor(Math.random()*options.length)],flex:slot==='flex'};
  await makePick();return true;
}

/* ================= Events ================= */
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;confirmKey=null;pending=null;render();try{localStorage.setItem('gg-tab',tab)}catch(_){}});
$('#view').addEventListener('click',async e=>{
  const t=e.target.closest('button,tr[data-open]');if(!t)return;const ds=t.dataset;
  if(ds.go){tab=ds.go;render();return}
  if(ds.open){openRow=openRow===ds.open?null:ds.open;render();return}
  if(ds.ssport){scoreSport=ds.ssport;render();return}
  if(ds.psport){pickSport=ds.psport;pending=null;render();return}
  if(ds.fsport){flexSport=ds.fsport;pending=null;render();return}
  if(ds.pick){pending={sport:chooserSport(),team:ds.pick,flex:pickSport==='flex'};render();return}
  if(ds.no!==undefined){confirmKey=null;render();return}
  if(ds.act==='alerts'){await enableAlerts();return}
  if(ds.act==='commishIn'){try{await AUTH.signIn();toast(isCommish?'Signed in as commissioner.':'That account isn’t the commissioner.')}catch(err){if(err?.code!=='auth/popup-closed-by-user')toast(err?.code==='auth/unauthorized-domain'?'Add this site under Firebase → Authentication → Settings → Authorized domains.':'Sign-in didn’t work. Try again.')}render();return}
  if(ds.act==='commishOut'){await AUTH.signOut();return}
  if(!canWrite)return;
  if(ds.claim||ds.unclaim){/* anyone can claim their own name */}
  else if(!ds.pick&&ds.act!=='confirmPick'&&ds.act!=='cancelPick'&&!ds.psport&&!isCommish)return;
  if(ds.move){const [i,dir]=ds.move.split(':').map(Number);const o=draftOrder();[o[i],o[i+dir]]=[o[i+dir],o[i]];return setDraft({...D(),status:'setup',order:o})}
  if(ds.claim){const m=S.members.find(x=>x.id===ds.claim);m.uid=me;render();try{await db.doc('members/'+m.id).set({name:m.name,order:m.order,uid:me})}catch(err){fail(err)}return}
  if(ds.unclaim){const m=S.members.find(x=>x.id===ds.unclaim);delete m.uid;render();try{await db.doc('members/'+m.id).set({name:m.name,order:m.order})}catch(err){fail(err)}return}
  if(ds.del){confirmKey='del:'+ds.del;render();return}
  if(ds.evdraft){confirmKey='ev:'+ds.evdraft;render();return}
  if(ds.sporton){S.cfg.sportsOn={...S.cfg.sportsOn,[ds.sporton]:!S.cfg.sportsOn?.[ds.sporton]};saveCfg();render();return}
  if(ds.avpdel){S.cfg.avpEvents=(S.cfg.avpEvents||[]).filter(e=>e.id!==ds.avpdel);saveCfg();render();return}
  if(ds.evtoggle){const id=ds.evtoggle,cur=S.cfg.events?.[id];S.cfg.events={...S.cfg.events,[id]:{active:!cur?.active,weight:cur?.weight||1}};saveCfg();render();return}
  if(ds.yes){const k=ds.yes;confirmKey=null;
    if(k==='start'){const now=new Date().toISOString();return setDraft({status:'live',order:draftOrder(),slots:mainSlots(),base:nextN(),startedAt:now,clockStart:now,pickSeconds:D().pickSeconds??119.5,paused:false})}
    if(k==='undo'){const last=draftPicks().at(-1);if(!last)return;S.picks=S.picks.filter(p=>p!==last);S.draft={...D(),status:'live',clockStart:new Date().toISOString(),paused:false,pausedElapsed:0};render();
      try{await db.doc('picks/'+pid(last.n)).delete();await db.doc('draft/main').set(S.draft)}catch(err){fail(err)}return}
    if(k.startsWith('del:')){const id=k.slice(4);S.members=S.members.filter(m=>m.id!==id);render();try{await db.doc('members/'+id).delete()}catch(err){fail(err)}return}
    if(k.startsWith('ev:')){const id=k.slice(3),now=new Date().toISOString();return setDraft({status:'live',order:standings().map(r=>r.m.id).reverse(),slots:{[id]:1},base:nextN(),startedAt:now,clockStart:now,pickSeconds:D().pickSeconds??119.5,paused:false})}
    if(k==='wipeTest'){autoRunning=false;const picks=[...S.picks],testers=S.members.filter(m=>m.test),manual=Object.keys(S.results).filter(id=>S.results[id].manual);
      S.picks=[];S.members=S.members.filter(m=>!m.test);manual.forEach(id=>delete S.results[id]);S.cfg.done={};saveCfg();
      S.draft={status:'setup',order:draftOrder(),pickSeconds:D().pickSeconds??119.5};render();
      try{for(const p of picks)await db.doc('picks/'+pid(p.n)).delete();for(const m of testers)await db.doc('members/'+m.id).delete();
        for(const id of manual)await db.doc('results/'+id).delete();await db.doc('draft/main').set(S.draft);toast('Test wiped. Ready for the real draft.')}catch(err){fail(err)}return}
    if(k==='resetScores'){const ids=Object.keys(S.results).filter(id=>S.results[id].manual);
      S.cfg.done={};saveCfg();for(const id of ids)delete S.results[id];render();
      try{for(const id of ids)await db.doc('results/'+id).delete();toast(`Scores reset. ${ids.length} corrections removed.`)}catch(err){fail(err)}return}
    if(k==='reset'){const all=[...S.picks];S.picks=[];render();try{for(const p of all)await db.doc('picks/'+pid(p.n)).delete();await db.doc('draft/main').set({status:'setup',order:draftOrder()});toast('All picks cleared.')}catch(err){fail(err)}return}
    return}
  if(ds.act==='shuffle'){const o=draftOrder();for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}return setDraft({...D(),status:'setup',order:o})}
  if(ds.act==='start'){confirmKey='start';render();return}
  if(ds.act==='pause'){const d=D();return setDraft({...d,paused:true,pausedElapsed:clockElapsed(d)})}
  if(ds.act==='resume'){const d=D();return setDraft({...d,paused:false,clockStart:new Date(Date.now()-clockElapsed(d)*1000).toISOString()})}
  if(ds.act==='resetClock')return setDraft({...D(),paused:false,pausedElapsed:0,clockStart:new Date().toISOString()});
  if(ds.act==='undo'){confirmKey='undo';render();return}
  if(ds.act==='reset'){confirmKey='reset';render();return}
  if(ds.act==='resetScores'){confirmKey='resetScores';render();return}
  if(ds.act==='wipeTest'){confirmKey='wipeTest';render();return}
  if(ds.act==='addTesters'){let order=S.members.reduce((a,m)=>Math.max(a,m.order||0),0);const n0=S.members.filter(m=>m.test).length;
    try{for(let k=1;k<=4;k++){const ref=db.collection('members').doc(),m={name:'Test '+(n0+k),order:++order,test:true};S.members.push({id:ref.id,...m});await ref.set(m)}render();toast('Added 4 test drafters.')}catch(err){fail(err)}return}
  if(ds.act==='autoPick'){await autoPick();return}
  if(ds.act==='autoAll'){autoRunning=!autoRunning;render();if(autoRunning){toast('Auto-drafting… tap Stop to pause it.');while(autoRunning&&D().status==='live'&&draftPicks().length<D().order.length*slotsTotal(D().slots)){if(!await autoPick())break;await new Promise(r=>setTimeout(r,250))}autoRunning=false;render()}return}
  if(ds.act==='cancelPick'){pending=null;render();return}
  if(ds.act==='confirmPick'){makePick();return}
});
$('#view').addEventListener('submit',async e=>{e.preventDefault();if(!canWrite)return;const f=e.target;
  if(f.id!=='freePick'&&!isCommish)return;
  if(f.id==='freePick'){const v=$('#freeInput').value.trim();if(!v)return;const def=defOf(chooserSport());
    const pool=poolOf(def);pending={sport:def.id,team:pool.find(x=>slug(x)===slug(v))||v,flex:pickSport==='flex'};render();return}
  if(f.id==='addMember'){const name=$('#newMember').value.trim();if(!name)return;
    const order=S.members.reduce((a,m)=>Math.max(a,m.order||0),0)+1,ref=db.collection('members').doc();
    S.members.push({id:ref.id,name,order});render();$('#newMember')?.focus();try{await ref.set({name,order})}catch(err){fail(err)}return}
  if(f.id==='addAvp'){const name=$('#newAvp').value.trim();if(!name)return;const id='t'+Date.now().toString(36);
    S.cfg.avpEvents=[...(S.cfg.avpEvents||[]),{id,name}];saveCfg();render();return}
  if(f.id==='addEvent'){const name=$('#newEvent').value.trim();if(!name)return;const id='x-'+slug(name).slice(0,30);
    if(eventList().some(x=>x.id===id))return toast('That event is already on the list.');
    S.cfg.customEvents=[...(S.cfg.customEvents||[]),{id,name}];S.cfg.events={...S.cfg.events,[id]:{active:true,weight:1}};saveCfg();render()}
});
function saveResult(sport,team,mut){const id=rid(sport,team);const r={sport,team,...(S.results[id]||{})};mut(r);r.manual=true;S.results[id]=r;queue(id,'results/'+id,()=>S.results[id])}
function onField(e){const t=e.target;if(!isCommish)return;
  if(t.dataset.pickseconds!==undefined){setDraft({...D(),order:draftOrder(),status:D().status||'setup',pickSeconds:Number(t.value)});return}
  if(t.id==='cfgSeason'){S.cfg.season=t.value;$('#seasonLabel').textContent='League year '+t.value;saveCfg();return}
  if(t.dataset.bonus){S.cfg.bonus={...DEF_BONUS,...S.cfg.bonus,[t.dataset.bonus]:t.dataset.bonus==='spoon'?Math.abs(Number(t.value)||0):Number(t.value)||0};saveCfg();return}
  if(t.dataset.showproj!==undefined){S.cfg.showProj=t.checked;saveCfg();render();return}
  if(t.dataset.done){S.cfg.done={...S.cfg.done,[t.dataset.done]:t.checked};saveCfg();render();return}
  if(t.dataset.evw){S.cfg.events={...S.cfg.events,[t.dataset.evw]:{...S.cfg.events[t.dataset.evw],weight:Number(t.value)}};saveCfg();render();return}
  if(t.dataset.res!==undefined){saveResult(scoreSport,t.dataset.res,r=>{r[t.dataset.k]=t.value===''?'':Number(t.value)});if(t.tagName==='SELECT')render();return}
  if(t.dataset.golf!==undefined){saveResult('golf',t.dataset.golf,r=>{const a=[...(r.pos||['','','',''])];a[+t.dataset.i]=t.value.trim();r.pos=a});return}
  if(t.dataset.avp!==undefined){saveResult(scoreSport,t.dataset.avp,r=>{r.res={...(r.res||{}),[t.dataset.ev]:t.value}});render();return}
  if(t.dataset.tennis!==undefined){saveResult('tennis',t.dataset.tennis,r=>{const a=[...(r.res||['','','',''])];a[+t.dataset.i]=t.value;r.res=a});render()}
}
$('#view').addEventListener('input',e=>{if(e.target.tagName==='INPUT'&&e.target.type!=='checkbox')onField(e)});
$('#view').addEventListener('change',e=>{
  if(e.target.dataset.draftsort!==undefined){draftSort=e.target.value;try{localStorage.setItem('gg-sort',draftSort)}catch(_){}render();return}
  if(e.target.tagName==='SELECT'||e.target.type==='checkbox')onField(e)});

/* ================= Live data ================= */
window.addEventListener('pageshow',e=>{if(e.persisted)location.reload()});
try{tab=localStorage.getItem('gg-tab')||tab}catch(_){}
if(!['standings','draft','scores','league'].includes(tab))tab='standings';
function rerender(){const a=document.activeElement;if(a&&a.closest?.('#view')&&a.matches('input,select'))return;render()}
(async()=>{
  try{db=await connect()}catch(err){console.warn(err);ready=true;
    $('#syncLine').textContent='Not connected';
    $('#view').innerHTML=`<div class="notice">${err.code==='no-config'?'This site isn’t connected to its database yet. Paste your Firebase settings into config.js (see the README).':err.code==='auth/operation-not-allowed'?'Turn on Anonymous sign-in in Firebase → Authentication → Sign-in method.':'Couldn’t connect to the league database. Check your connection and reload.'}</div>`;return}
  canWrite=true;
  let got=0;const done=s=>{if(s?.metadata?.fromCache)return;if(++got>=4&&!ready){ready=true;render()}};
  setTimeout(()=>{if(!ready){ready=true;render();toast('Still connecting. Showing what’s loaded.')}},10000);
  db.collection('members').orderBy('order').onSnapshot(s=>{S.members=s.docs.map(d=>({id:d.id,...d.data()}));done(s);rerender()},e=>{done();fail(e)});
  db.collection('picks').onSnapshot(s=>{S.picks=s.docs.map(d=>({...d.data()})).filter(p=>typeof p.n==='number').sort((a,b)=>a.n-b.n);done(s);rerender()},e=>{done();fail(e)});
  db.doc('draft/main').onSnapshot(s=>{S.draft=s.exists?{...s.data()}:{status:'setup',order:[]};done(s);rerender()},e=>{done();fail(e)});
  db.doc('config/main').onSnapshot(s=>{if(!dirty.cfg){const d=s.exists?structuredClone(s.data()):{};S.cfg={...structuredClone(DEF_CFG),...d,bonus:{...DEF_BONUS,...(d.bonus||{})},sportsOn:d.sportsOn||structuredClone(DEF_CFG.sportsOn)}}done(s);rerender()},e=>{done();fail(e)});
  db.collection('results').onSnapshot(s=>{const next={};s.docs.forEach(d=>next[d.id]=structuredClone(d.data()));for(const k in S.results)if(dirty[k])next[k]=S.results[k];S.results=next;rerender()},fail);
  db.collection('meta').onSnapshot(s=>{S.meta={};s.docs.forEach(d=>S.meta[d.id]=d.data());rerender()},()=>{});
  db.doc('sync/main').onSnapshot(s=>{S.sync=s.exists?s.data():null;rerender()},()=>{});
})();
</script>
