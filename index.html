<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guinness Gauntlet</title>
<meta name="description" content="Our multi-sport league: one draft, every season, one champion.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f0e6cf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gauntlet">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a poured pint. Cream "head" band on top, stout-dark body, sticky tab bar, one column of panels. */
:root{
  color-scheme:dark;
  --bg:#14110f; --panel:#1d1916; --panel2:#27211c; --cream:#f0e6cf; --ink:#14110f;
  --muted:#a89d89; --rule:#3a322b; --amber:#d9a03f; --good:#86c493; --bad:#e58268;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--f-body);font-size:15px;line-height:1.45}
.in{max-width:840px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.head{background:var(--cream);color:var(--ink);padding-top:env(safe-area-inset-top,0px)}
.head .in{padding-block:22px 18px;display:flex;flex-direction:column;gap:4px}
.head h1{font-family:var(--f-display);font-weight:900;font-size:58px;line-height:.88;letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance}
.head .sub{font-size:14px;font-weight:500;display:flex;flex-wrap:wrap;gap:4px 12px}
.head .sync{font-size:13px;opacity:.75}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--rule)}
nav .in{display:flex;gap:2px;overflow-x:auto}
nav button{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.04em;text-transform:uppercase;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:10px 12px 7px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--cream);border-bottom-color:var(--amber)}
main.in{padding-block:20px calc(56px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-family:var(--f-display);font-weight:900;font-size:28px;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1}
h3{font-family:var(--f-display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin:0}
p{margin:0;max-width:65ch}
.label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.l{text-align:left}
tr.lead td{color:var(--amber)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--panel2)}
td.total{font-weight:600;font-size:16px}
.detail>td{background:var(--panel2);white-space:normal;text-align:left}
.detail table td{background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 14px var(--f-body);border:1px solid var(--rule);background:var(--panel2);color:var(--cream);border-radius:999px;padding:6px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.chip:disabled{opacity:.4;cursor:default;text-decoration:line-through}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
input,select{font:inherit;color:var(--cream);background:var(--panel2);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;min-width:0}
input.n{width:4.6em;font-family:var(--f-mono);text-align:center}
.grow{flex:1 1 180px}
.btn{font:700 14px var(--f-body);background:var(--amber);color:var(--ink);border:0;border-radius:6px;padding:9px 15px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--rule)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{background:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.notice{border:1px dashed var(--rule);border-radius:10px;padding:14px;color:var(--muted)}
.clock{background:var(--cream);color:var(--ink);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px}
.clock .who{font-family:var(--f-display);font-weight:900;font-size:40px;line-height:.95;text-transform:uppercase}
.clock .meta{font-size:14px;font-weight:500}
.clockrow{display:flex;justify-content:space-between;align-items:center;gap:16px}
.clockrow>div:first-child{display:flex;flex-direction:column;gap:6px;min-width:0}
.timer{display:flex;align-items:center;gap:10px;flex:none}
.pint{width:58px;height:100px;color:var(--ink);overflow:visible}
.pint .glass{fill:rgba(20,17,15,.07)}
.timer.low .pint{color:var(--bad)}
.tleft{font-family:var(--f-mono);font-size:26px;font-variant-numeric:tabular-nums;line-height:1}
.timer.low .tleft{color:#b3402b}
.tsub{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;opacity:.7}
.tctl{display:flex;gap:6px;flex-wrap:wrap}
.tctl .btn.ghost{color:var(--ink);border-color:rgba(20,17,15,.3)}
.you{display:inline-block;background:var(--amber);color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:2px 8px;vertical-align:middle}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.team{font:500 14px var(--f-body);text-align:left;background:var(--panel2);color:var(--cream);border:1px solid var(--rule);border-radius:6px;padding:9px 10px;cursor:pointer}
.team:hover:not(:disabled){border-color:var(--amber)}
.team:disabled{opacity:.38;cursor:default}
.team small{display:block;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.team{display:flex;gap:9px;align-items:center}.team>span{min-width:0}
.logo{width:22px;height:22px;object-fit:contain;flex:none;vertical-align:middle}
.logo.sm{width:18px;height:18px;margin-right:6px}
.logo.lg{width:30px;height:30px;margin-right:8px}
.flag{font-size:20px;line-height:1;flex:none;width:22px;text-align:center}
.flag.sm{font-size:15px;margin-right:6px;width:auto}
.flag.lg{font-size:24px;margin-right:8px;width:auto}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--amber);border-radius:8px;padding:12px}
.list{display:flex;flex-direction:column}
.list>div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.list>div:last-child{border-bottom:0}
.add{display:flex;gap:8px;flex-wrap:wrap}.add input{flex:1 1 160px}
.card{border-top:1px solid var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.card:first-child{border-top:0;padding-top:0}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.pts{font-family:var(--f-mono);font-size:18px}
.quad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.quad input,.quad select{width:100%;text-align:center;font-family:var(--f-mono);padding:6px 2px}
.rules dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 16px;margin:0}
.rules dt{font-weight:600}.rules dd{margin:0;color:var(--muted)}
textarea{font:inherit;color:var(--cream);background:var(--panel2);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;width:100%;min-height:90px}
.evform{display:grid;gap:8px;margin-top:10px}
.swapbtn{background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.ev{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--rule)}
.ev:last-child{border-bottom:0}
.tname{font-weight:600;display:block}.pname{display:block;font-size:12px;color:var(--muted)}
.seasonsw .chip{background:transparent;color:var(--ink);border-color:rgba(20,17,15,.35)}
.seasonsw .chip[aria-pressed="true"]{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.tl{position:relative;min-width:640px;padding-top:26px}
.tl-row{display:grid;grid-template-columns:64px 1fr;align-items:center;height:30px}
.tl-head{height:18px;position:absolute;top:0;left:0;right:0}
.tl-name{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.tl-track{position:relative;height:100%;border-bottom:1px solid var(--rule)}
.tl-month{position:absolute;top:0;font-size:11px;color:var(--muted);transform:translateX(2px);letter-spacing:.06em;text-transform:uppercase}
.tl-bar{position:absolute;top:9px;height:12px;border:0;border-radius:3px;padding:0;cursor:pointer;background:var(--amber);opacity:.45}
.tl-bar.post{opacity:1}
.tl-bar:hover,.tl-bar:focus-visible{outline:2px solid var(--cream);outline-offset:1px}
.tl-lines{position:absolute;top:22px;bottom:40px;left:64px;right:56px;pointer-events:none}
.tl-line{position:absolute;top:0;bottom:0;border-left:1px solid var(--muted)}
.tl-line span{position:absolute;bottom:-17px;left:0;transform:translateX(-50%);font-size:10px;line-height:14px;color:var(--muted);white-space:nowrap;background:var(--panel);padding:0 4px}
.tl-line::after{content:'';position:absolute;left:-1px;top:100%;height:24px;border-left:1px solid var(--muted)}
.tl-line.r1::after{height:40px}
.tl-line.dotted::after{left:-2px;border-left:2px dotted var(--amber)}
.tl-line.today::after{left:-2px;border-left:2px solid var(--cream)}
.tl-line.end::after{left:-2px;border-left:2px solid var(--amber)}
.tl-line span{z-index:1}
.tl-line.r1 span{bottom:-33px}
.tl-line.dotted{border-left:2px dotted var(--amber)}
.tl-line.dotted span{color:var(--amber);font-weight:600}
.tl-line.today{border-left:2px solid var(--cream)}
.tl-line.end{border-left:2px solid var(--amber)}
.tl-row.other{opacity:.35}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:inherit}
.chart .grid{stroke:var(--rule);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.legend .chip{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:4px;border-radius:2px;display:inline-block}
.ctip{position:fixed;z-index:20;pointer-events:none;background:var(--panel2);border:1px solid var(--rule);border-radius:6px;padding:6px 9px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.4);white-space:nowrap}
.ctip b{display:block}.ctip span{color:var(--muted);font-size:12px}
.chart.hovering .sline:not(.hot){opacity:.15}
.chart.hovering .sline.hot{opacity:1}
.sg{padding-top:8px}
.sg-cv{width:100%;max-width:480px;aspect-ratio:480/504;display:block;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}
.sg-dots{display:flex;gap:6px;margin:8px 0}
.sg-dots span{min-width:34px;height:28px;border:1px solid var(--rule);border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.sg-dots span.on{border-color:var(--amber);color:var(--cream)}.sg-dots span.done{background:var(--panel2);color:var(--cream)}
.sg-btns{display:flex;justify-content:center;margin-top:6px}
.sg-hold{min-width:220px;padding:14px 18px;font-size:17px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.mside{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0}
.mside+.mside{border-top:1px solid var(--rule)}
.mnames{display:flex;flex-direction:column;gap:3px;min-width:0}
.mname{display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:14px}
.mside.won .mname>span:not(.owner),.mside.won .gscore{font-weight:700;color:var(--cream)}
.gstake{font-size:12px;color:var(--muted);margin-top:6px;padding-top:6px;border-top:1px dashed var(--rule)}.gstake strong{color:var(--amber)}
.rough{color:var(--amber);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.tl-line.end span{color:var(--amber);font-weight:700}
.tl-line.today span{color:var(--cream);font-weight:700}
.tl{padding-bottom:40px;padding-right:56px}
.needs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.need{border:1px dashed var(--rule);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.need.done{border-style:solid;background:var(--panel2)}
.move{white-space:nowrap}.move .up{color:var(--good);font-weight:700}.move .down{color:var(--bad);font-weight:700}
.move .gain{display:block;font-size:11px;color:var(--muted)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.game{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;background:var(--panel)}
.game.ours{border-color:var(--amber);background:var(--panel2)}
.gstatus{font-size:12px;color:var(--muted)}.glg{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--rule);border-radius:4px;padding:0 5px;margin-right:6px;color:var(--cream)}.gstatus.live{color:var(--good);font-weight:600}
.gside{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center}
.gside .gname{min-width:0}.gside.won .gname,.gside.won .gscore{font-weight:700}
.gscore{font-size:16px}
.owners{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.owner{display:inline-block;white-space:nowrap;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink);background:var(--amber);border-radius:999px;padding:1px 7px;vertical-align:middle}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:1px 7px}
.tag.done{color:var(--amber)} .tag.live{color:var(--good)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--cream);color:var(--ink);font-weight:600;padding:9px 14px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
[hidden]{display:none!important}
/* Computers: use more of the screen so rosters and standings fit without sideways scrolling. Phones are unchanged. */
@media (min-width:1000px){
  .in{max-width:min(1500px,96vw)}
  p{max-width:80ch}
}
/* Rosters: let long names wrap inside their column instead of pushing the table wider. */
@media (min-width:700px){
  table.roster td{white-space:normal;min-width:6.5em;vertical-align:top}
  table.roster td:first-child{min-width:0;white-space:nowrap}
  table.roster .logo.sm{width:16px;height:16px;margin-right:5px}
  table.roster.dense{font-size:13px}
  table.roster.dense th,table.roster.dense td{padding:6px 4px}
  table.roster.dense td{min-width:5.5em}
  table.roster.dense .logo.sm{width:14px;height:14px;margin-right:4px}
  table.roster.dense .flag.sm{font-size:13px;margin-right:4px}
}
@media (max-width:520px){.head h1{font-size:44px}.clock .who{font-size:32px}nav button{font-size:16px;padding:10px 7px 7px}.rules dl{grid-template-columns:1fr}.rules dd{margin-bottom:6px}}
@media (prefers-reduced-motion:no-preference){.chip,.team,nav button{transition:background .15s,border-color .15s,color .15s}}
</style>
</head>
<body>
<header class="head"><div class="in">
  <h1>Guinness Gauntlet</h1>
  <div class="sub"><span id="seasonLabel">League year 2026–27</span><span>Every sport scaled to MLB’s 162 games</span></div>
  <div class="chips seasonsw" id="seasonSwitch" hidden></div>
  <div class="sync" id="syncLine">Connecting…</div>
</div></header>
<nav><div class="in" role="tablist">
  <button id="tab-standings" role="tab" data-tab="standings" aria-selected="true">Standings</button>
  <button id="tab-games" role="tab" data-tab="games" aria-selected="false">Games</button>
  <button id="tab-draft" role="tab" data-tab="draft" aria-selected="false">Draft</button>
  <button id="tab-scores" role="tab" data-tab="scores" aria-selected="false">Scores</button>
  <button id="tab-stats" role="tab" data-tab="stats" aria-selected="false">Stats</button>
  <button id="tab-splitg" role="tab" data-tab="splitg" aria-selected="false">Split the G</button>
  <button id="tab-league" role="tab" data-tab="league" aria-selected="false">League</button>
</div></nav>
<main class="in" id="view"><div class="notice">Loading the league…</div></main>
<div id="toast" hidden></div>

<script src="config.js"></script>
<script type="module">
/* ================= Firebase adapter ================= */
const FB='https://www.gstatic.com/firebasejs/10.12.2/';
let db=null,me=null,email='',isCommish=false,AUTH=null;
const isPlayer=()=>!!email; // signed in with Google (anonymous visitors can only look)
async function connect(){
  const cfg=window.GG_FIREBASE;
  if(!cfg||!cfg.apiKey||cfg.apiKey.startsWith('PASTE'))throw Object.assign(new Error('config'),{code:'no-config'});
  const [{initializeApp},F,A]=await Promise.all([import(FB+'firebase-app.js'),import(FB+'firebase-firestore.js'),import(FB+'firebase-auth.js')]);
  const app=initializeApp(cfg),fs=F.getFirestore(app),auth=A.getAuth(app);
  let first=true,res0;
  const applyUser=u=>{me=u.uid;email=(u.email||u.providerData?.[0]?.email||'').toLowerCase();
    const done=c=>{isCommish=c;if(first){first=false;res0()}else{markGoogleClaim();render()}};
    if(!email)return done(false);
    crypto.subtle.digest('SHA-256',new TextEncoder().encode(email)).then(h=>{
      const hex=[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');
      done(hex===String(window.GG_COMMISSIONER_HASH||'').trim().toLowerCase())}).catch(()=>done(false))};
  await new Promise((res,rej)=>{res0=res;A.onAuthStateChanged(auth,u=>{if(!u){A.signInAnonymously(auth).catch(rej);return}applyUser(u)})});
  AUTH={
    // Link this device's visitor account to Google, so an existing "This is me" here keeps working; if that Google
    // account is already in use (signed in on another device), switch to it instead.
    signIn:async()=>{const prov=new A.GoogleAuthProvider();prov.setCustomParameters({prompt:'select_account'});const u=auth.currentUser;
      if(u&&u.isAnonymous){try{const r=await A.linkWithPopup(u,prov);await r.user.getIdToken(true);await r.user.reload();applyUser(auth.currentUser);return}
        catch(e){const cred=A.GoogleAuthProvider.credentialFromError(e);if(e.code==='auth/credential-already-in-use'&&cred){await A.signInWithCredential(auth,cred);return}throw e}}
      await A.signInWithPopup(auth,prov)},
    signOut:()=>A.signOut(auth)};
  const wrapSnapDoc=s=>({id:s.id,exists:s.exists(),data:()=>s.data(),metadata:s.metadata});
  const wrapD=r=>({id:r.id,get:async()=>wrapSnapDoc(await F.getDoc(r)),set:(d,o)=>o?F.setDoc(r,d,o):F.setDoc(r,d),delete:()=>F.deleteDoc(r),
    onSnapshot:(n,e)=>F.onSnapshot(r,s=>n(wrapSnapDoc(s)),e)});
  const wrapQ=q=>({onSnapshot:(n,e)=>F.onSnapshot(q,s=>n({docs:s.docs.map(wrapSnapDoc),metadata:s.metadata}),e)});
  return {
    doc:p=>wrapD(F.doc(fs,p)),
    collection:p=>{const ref=F.collection(fs,p);return {orderBy:f=>wrapQ(F.query(ref,F.orderBy(f))),onSnapshot:(n,e)=>wrapQ(ref).onSnapshot(n,e),doc:id=>wrapD(id?F.doc(ref,id):F.doc(ref))}}
  };
}

/* ================= Sports & rules ================= */
const BASE=162;
const T=s=>s.split('|');

/* Pick timer: a pint that drains as the clock runs. */
const GLASS='M9 6 L71 6 L74 42 L63 134 L17 134 L6 42 Z';
const PINT=`<svg class="pint" viewBox="0 0 80 140" aria-hidden="true"><defs><clipPath id="pintClip"><path d="${GLASS}"/></clipPath></defs>
  <path class="glass" d="${GLASS}"/>
  <g clip-path="url(#pintClip)"><rect id="beer" x="0" y="16" width="80" height="130" fill="#1b100b"/><rect id="foam" x="0" y="6" width="80" height="11" fill="#fbf4e2"/></g>
  <path d="${GLASS}" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg>`;
function clockElapsed(d){if(d.paused)return Number(d.pausedElapsed)||0;const t=Date.parse(d.clockStart||d.startedAt||'');return isNaN(t)?0:Math.max(0,(Date.now()-t)/1000)}
function tick(){
  const el=document.getElementById('timer'),d=D();if(!el||d.status!=='live'||!d.pickSeconds)return;
  const total=d.pickSeconds,left=Math.max(0,total-clockElapsed(d)),frac=left/total;
  const top=16+(1-frac)*(134-16);
  const beer=document.getElementById('beer'),foam=document.getElementById('foam');
  beer.setAttribute('y',top.toFixed(1));foam.setAttribute('y',(top-10).toFixed(1));foam.setAttribute('height',left>0?'11':'0');
  document.getElementById('tLeft').textContent=(Math.floor(left*10)/10).toFixed(1);
  document.getElementById('tSub').textContent=d.paused?'Paused':left>0?'seconds':'Time’s up';
  el.classList.toggle('low',left<=Math.min(10,total*.2));
}
setInterval(()=>{tick();checkMyTurn()},100);

/* Draft alerts: chime, vibration, tab title and a notification when it's your pick (site must be open). */
const TITLE=document.title;
let audioCtx=null,lastAlert='',lastCall='',wakeLock=null;
function unlockAudio(){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(_){}}
document.addEventListener('pointerdown',unlockAudio);
function chime(n){if(!audioCtx)return;const t0=audioCtx.currentTime;
  [659,880,1047].slice(0,n).forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=t0+i*.2;
    o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.6);
    o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+.65)})}
function alertMe(kind){
  chime(kind==='up'?3:2);
  try{navigator.vibrate?.(kind==='up'?[250,120,250,120,250]:[150,80,150])}catch(_){}
  if(document.hidden&&'Notification' in window&&Notification.permission==='granted'){
    try{new Notification(kind==='up'?'🍺 You’re on the clock':'⏳ 20 seconds left to pick',{body:'Guinness Gauntlet draft',icon:'icons/icon-192.png',tag:'gg-draft'})}catch(_){}}
}
function myTurn(){const d=D();if(!ready||d.status!=='live')return null;const i=draftPicks().length;if(i>=(d.order||[]).length*slotsTotal(d.slots))return null;
  const m=S.members.find(x=>x.id===onClock(i));return isMe(m)?{d,key:(d.base||0)+':'+i}:null}
function checkMyTurn(){
  const t=myTurn();document.title=t?'🍺 You’re up! · '+TITLE:TITLE;if(!t)return;
  if(lastAlert!==t.key){lastAlert=t.key;alertMe('up')}
  if(t.d.pickSeconds&&!t.d.paused){const left=t.d.pickSeconds-clockElapsed(t.d);if(left<=20&&left>0&&lastCall!==t.key){lastCall=t.key;alertMe('last')}}
}
async function keepAwake(){try{if('wakeLock' in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener?.('release',()=>{wakeLock=null})}}catch(_){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&D().status==='live'&&alertsOn())keepAwake()});
const alertsOn=()=>{try{return localStorage.getItem('gg-alerts')==='on'}catch(_){return false}};
async function enableAlerts(){unlockAudio();chime(3);try{navigator.vibrate?.([200])}catch(_){}
  try{if('Notification' in window&&Notification.permission==='default')await Notification.requestPermission()}catch(_){}
  try{localStorage.setItem('gg-alerts','on')}catch(_){}keepAwake();render();toast('Draft alerts on. Keep this page open during the draft.')}

const fail=e=>{console.error(e);toast(e?.code==='permission-denied'?'The database refused that change. Check the Firestore rules.':'Couldn’t save. Check your connection and try again.')};
function queue(key,path,getData){dirty[key]=true;clearTimeout(timers[key]);timers[key]=setTimeout(()=>flush(key,path,getData),600)}
async function flush(key,path,getData){if(!db)return;
  if(inflight[key]){again[key]=[path,getData];return}inflight[key]=true;
  try{await db.doc(path).set(getData())}catch(e){fail(e)}inflight[key]=false;
  if(again[key]){const a=again[key];again[key]=null;flush(key,...a)}else dirty[key]=false}
const saveCfg=()=>{const k=viewSeason;queue('cfg:'+k,cfgPath(k),()=>{const c=structuredClone(S.cfg);if(k===1&&S.cfgs[1]?.current)c.current=S.cfgs[1].current;return c})};
async function setDraft(d){const k=viewSeason;S.draft=d;S.drafts[k]=d;render();try{await db.doc(draftPath(k)).set(d)}catch(e){fail(e)}}
async function makePick(){
  const d=D(),i=draftPicks().length,mid=onClock(i),p=pending;pending=null;if(!p||!mid)return;
  if(p.key&&p.key!==(d.base||0)+':'+i){render();return toast('The pick moved on before you confirmed. Choose again.')}
  if(!canPickFor(mid)){render();return toast(`It’s ${mname(mid)}’s pick. Only they or the commissioner can make it.`)}
  if(d.paused){render();return toast('The commissioner paused the draft. Wait for Resume.')}
  if(takenMap(p.sport)[slug(p.team)]){render();return toast(p.team+' is already taken.')}
  const slotKey=p.flex?'flex':p.sport;
  if((need(mid)[slotKey]||0)<1){render();return toast(mname(mid)+' already has their '+defOf(slotKey).short+' pick.')}
  const n=nextN(),ref=db.doc('picks/'+pid(n));
  try{const ex=await ref.get();if(ex.exists){toast('Someone just made that pick. The board has refreshed.');render();return}
    const doc={n,season:viewSeason,member:mid,sport:p.sport,team:p.team,at:new Date().toISOString(),...(p.flex?{flex:true}:{})};
    S.picks.push(doc);S.allPicks.push(doc);render();
    try{await ref.set(doc)}catch(err){S.picks=S.picks.filter(x=>x!==doc);S.allPicks=S.allPicks.filter(x=>x!==doc);render();throw err}
    const finished=i+1>=d.order.length*slotsTotal(d.slots);
    await setDraft({...D(),status:finished?'done':'live',clockStart:doc.at,paused:false,pausedElapsed:0});
  }catch(e){fail(e)}
}

function projSwitch(){return `<label class="row small" style="align-items:center;gap:8px"><input type="checkbox" id="showProj" data-showproj${showProj()?' checked':''}> Show projected points and “best available” in the draft</label>`}
function bestAvailable(openSports){
  if(!showProj())return '';
  const ids=openSports.includes('flex')?[...new Set([...openSports.filter(x=>x!=='flex'),...flexSports().map(x=>x.id)])]:openSports;
  const rows=[];for(const id of ids){const def=defOf(id);if(!def.teams)continue;const tk=takenMap(id);
    for(const t of teamList(def))if(!tk[slug(t)]){const pp=projPts(def,t);if(pp!=null)rows.push({id,t,pp,short:def.short})}}
  if(!rows.length)return '';rows.sort((a,b)=>b.pp-a.pp);
  return `<section class="panel"><div class="label">Best available for the sports they still need</div><div class="list">${rows.slice(0,5).map(x=>
    `<div><span>${logoImg(x.id,x.t,'sm')}${esc(x.t)} <span class="muted small">${esc(x.short)}</span></span><span class="num">Proj ${Math.round(x.pp)}</span></div>`).join('')}</div>
    <p class="small muted">Golf and tennis don’t have projections; pick on gut and form.</p></section>`;
}
let autoRunning=false,pendingKey='',evOrder=[],needsFor='',evEdit=null,swapTo=null;
function evOrderFor(kind){const st=standings().map(r=>r.m.id);
  if(kind==='standings')return st;
  if(kind==='main'){const o=(S.draft?.mainOrder||S.draft?.order||[]).filter(id=>st.includes(id));return [...o,...st.filter(id=>!o.includes(id))]}
  if(kind==='shuffle'){const o=[...st];for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]]}return o}
  return st.reverse()}
function canPickFor(mid){const m=S.members.find(x=>x.id===mid);return isCommish||(isPlayer()&&(!m?.uid||m.uid===me))}
async function autoPick(){
  const d=D(),i=draftPicks().length;if(d.status!=='live'||i>=d.order.length*slotsTotal(d.slots))return false;
  const mid=onClock(i),nd=need(mid),open=Object.keys(nd).filter(k=>nd[k]>0);if(!open.length)return false;
  // Best available: for each slot still needed, find the best pick left in that sport. Teams are ranked by projected
  // season points (#1 = best in the league); golfers, tennis players and event picks by their place in our ranked lists.
  // Take whichever is ranked highest in its own sport, so the auto-pick grabs the scarcest top talent first.
  const cands=[];
  for(const slot of open){
    const sports=slot==='flex'?flexSports().map(x=>x.id):[slot];
    for(const sport of sports){const def=defOf(sport),tk=takenMap(sport);
      if(def.teams){const ranks=projRanks(def);for(const t of teamList(def))if(!tk[slug(t)])cands.push({slot,sport,team:t,rank:ranks[slug(t)]||99,pp:projPts(def,t)??0,flex:slot==='flex'})}
      else poolOf(def).forEach((t,idx)=>{if(!tk[slug(t)])cands.push({slot,sport,team:t,rank:idx+1,pp:0,flex:slot==='flex'})})}
  }
  // Use the flex spot last, so regular slots fill with their own sport first
  cands.sort((a,b)=>(a.flex-b.flex)||(a.rank-b.rank)||(b.pp-a.pp));
  let pick=cands[0];
  if(!pick){const sport=open[0]==='flex'?flexSports()[0].id:open[0],tk=takenMap(sport);let k=1;while(tk[slug('Test pick '+k)])k++;pick={sport,team:'Test pick '+k,flex:open[0]==='flex'}}
  pending={sport:pick.sport,team:pick.team,flex:!!pick.flex};
  await makePick();return true;
}

let sgOpen=null;
function viewSplitG(){const rows=Object.entries(S.splitg||{}).map(([id,v])=>({m:S.members.find(x=>x.id===id),...v})).filter(r=>r.m).sort((a,b)=>b.best-a.best);
  const lvRow=(label,arr)=>arr?`<tr><td class="l small">${label}</td>${SG_LEVELS.map((_,i)=>`<td class="num">${arr[i]??'–'}</td>`).join('')}<td class="num total">${arr.reduce((a,b)=>a+(b||0),0)}</td></tr>`:'';
  const detail=r=>`<tr class="detail"><td colspan="5"><div class="scroll"><table><tr><th class="l"></th>${SG_LEVELS.map(L=>`<th>${esc(L.name)}</th>`).join('')}<th>Total</th></tr>
    ${lvRow('High-score run',r.bestLevels)}${lvRow('Last run',r.lastLevels)}${lvRow('Best ever per glass',r.topLevels)}</table></div>${r.bestLevels?'':'<p class="small muted">Glass-by-glass scores start with the next run.</p>'}</td></tr>`;
  return signInNote('save your Split the G scores')+`<div id="gameMount"></div>
  <section class="panel"><div class="cardhead"><h2>Leaderboard</h2><span class="small muted">Best total over all ${SG_LEVELS.length} glasses</span></div>
  ${rows.length?`<div class="scroll"><table><tr><th class="l">#</th><th class="l">Name</th><th>High score</th><th>Last run</th><th>Runs</th></tr>${rows.map((r,i)=>`<tr class="click" data-open="sg:${r.m.id}" aria-expanded="${sgOpen===r.m.id}"><td class="num l">${i+1}</td><td class="l">${whoHtml(r.m.id)}</td><td class="num total">${r.best}</td><td class="num">${r.last??''}</td><td class="num">${r.runs||1}</td></tr>`+(sgOpen===r.m.id?detail(r):'')).join('')}</table></div>`:'<p class="small muted">No scores yet. Be the first.</p>'}
  <p class="small muted">Each glass scores up to 100: a split (within 1.5 mm of the middle of the G) is 100, and you lose 5 points for every millimetre off after that. Later glasses pour faster. Tap a name to see their score on each glass.</p></section>`}

/* ================= Live data ================= */
window.addEventListener('pageshow',e=>{if(e.persisted)location.reload()});
try{tab=localStorage.getItem('gg-tab')||tab}catch(_){}
if(!['standings','games','draft','scores','stats','splitg','league'].includes(tab))tab='standings';
let rerenderWaiting=false;
function rerender(){
  const a=document.activeElement;
  if(a&&a.closest?.('#view')&&a.matches('select')){if(!rerenderWaiting){rerenderWaiting=true;a.addEventListener('blur',()=>{rerenderWaiting=false;render()},{once:true})}return}
  if(a&&a.closest?.('#view')&&a.matches('input')&&a.id){const id=a.id,val=a.value,ss=a.selectionStart,se=a.selectionEnd;render();
    const b=document.getElementById(id);if(b){b.value=val;b.focus();try{b.setSelectionRange(ss,se)}catch(_){}}return}
  render()}
(async()=>{
  try{db=await connect()}catch(err){console.warn(err);ready=true;
    $('#syncLine').textContent='Not connected';
    $('#view').innerHTML=`<div class="notice">${err.code==='no-config'?'This site isn’t connected to its database yet. Paste your Firebase settings into config.js (see the README).':err.code==='auth/operation-not-allowed'?'Turn on Anonymous sign-in in Firebase → Authentication → Sign-in method.':'Couldn’t connect to the league database. Check your connection and reload.'}</div>`;return}
  canWrite=true;setTimeout(markGoogleClaim,1500);
  let got=0;const done=s=>{if(s?.metadata?.fromCache)return;if(++got>=4&&!ready){ready=true;render()}};
  setTimeout(()=>{if(!ready){ready=true;render();toast('Still connecting. Showing what’s loaded.')}},10000);
  db.collection('members').orderBy('order').onSnapshot(s=>{S.members=s.docs.map(d=>({id:d.id,...d.data()}));done(s);rerender()},e=>{done();fail(e)});
  db.collection('picks').onSnapshot(s=>{S.allPicks=s.docs.map(d=>({...d.data()})).filter(p=>typeof p.n==='number').sort((a,b)=>a.n-b.n);applySeason();done(s);rerender()},e=>{done();fail(e)});
  db.collection('draft').onSnapshot(s=>{S.drafts={};s.docs.forEach(d=>{const k=d.id==='main'?1:+(d.id.match(/^s(\d+)$/)||[])[1];if(k)S.drafts[k]={...d.data()}});applySeason();done(s);rerender()},e=>{done();fail(e)});
  db.collection('config').onSnapshot(s=>{S.cfgs={};s.docs.forEach(d=>{const k=d.id==='main'?1:+(d.id.match(/^s(\d+)$/)||[])[1];if(k)S.cfgs[k]=structuredClone(d.data())});
    if(!viewSeasonChosen){viewSeasonChosen=true;let saved=0;try{saved=+localStorage.getItem('gg-season')||0}catch(_){}viewSeason=saved&&saved<=curSeason()?saved:curSeason()}
    if(viewSeason>curSeason())viewSeason=curSeason();applySeason();done(s);rerender()},e=>{done();fail(e)});
  db.collection('results').onSnapshot(s=>{loaded.results=true;S.resultsAll={};s.docs.forEach(d=>S.resultsAll[d.id]=structuredClone(d.data()));applySeason();rerender()},fail);
  db.collection('meta').onSnapshot(s=>{S.metaAll={};s.docs.forEach(d=>S.metaAll[d.id]=d.data());applySeason();rerender()},()=>{});
  db.collection('splitg').onSnapshot(s=>{S.splitg={};s.docs.forEach(d=>S.splitg[d.id]=d.data());if(tab==='splitg')rerender()},()=>{});
  db.collection('history').onSnapshot(s=>{loaded.history=true;S.historyAll={};s.docs.forEach(d=>S.historyAll[d.id]=d.data());applySeason();rerender()},()=>{});
  db.doc('sync/main').onSnapshot(s=>{S.sync=s.exists?s.data():null;rerender()},()=>{});
})();
</script>
</body>
</html>
